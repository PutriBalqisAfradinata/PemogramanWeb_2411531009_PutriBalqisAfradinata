<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="353" viewBox="0 0 1440 353"><rect width="1440" height="353" fill="#17191f"/><rect width="1440" height="42" fill="#282c34"/><circle cx="20" cy="21" r="6" fill="#ff6b83"/><circle cx="40" cy="21" r="6" fill="#ffd166"/><circle cx="60" cy="21" r="6" fill="#71d99e"/><text x="84" y="27" fill="#e8eaf0" font-family="Consolas,monospace" font-size="15">lib/services/recipe_service.dart  ?  B.1 ? GET melalui RecipeService</text><text x="20" y="70" fill="#707782" font-family="Consolas,monospace" font-size="15">01</text><text x="68" y="70" fill="#e8a8ff" font-family="Consolas,monospace" font-size="16">  Future&lt;List&lt;Recipe&gt;&gt; fetchRecipes({int limit = 50}) async {</text><text x="20" y="95" fill="#707782" font-family="Consolas,monospace" font-size="15">02</text><text x="68" y="95" fill="#e8a8ff" font-family="Consolas,monospace" font-size="16">    final uri = Uri.parse('$_baseUrl/recipes?limit=$limit');</text><text x="20" y="120" fill="#707782" font-family="Consolas,monospace" font-size="15">03</text><text x="68" y="120" fill="#e8a8ff" font-family="Consolas,monospace" font-size="16">    final response = await _client.get(uri).timeout(_timeout);</text><text x="20" y="145" fill="#707782" font-family="Consolas,monospace" font-size="15">04</text><text x="68" y="145" fill="#d6deeb" font-family="Consolas,monospace" font-size="16">    _checkStatus(response);</text><text x="20" y="170" fill="#707782" font-family="Consolas,monospace" font-size="15">05</text><text x="68" y="170" fill="#d6deeb" font-family="Consolas,monospace" font-size="16"></text><text x="20" y="195" fill="#707782" font-family="Consolas,monospace" font-size="15">06</text><text x="68" y="195" fill="#e8a8ff" font-family="Consolas,monospace" font-size="16">    final body = jsonDecode(response.body) as Map&lt;String, dynamic&gt;;</text><text x="20" y="220" fill="#707782" font-family="Consolas,monospace" font-size="15">07</text><text x="68" y="220" fill="#e8a8ff" font-family="Consolas,monospace" font-size="16">    final list = body['recipes'] as List&lt;dynamic&gt;;</text><text x="20" y="245" fill="#707782" font-family="Consolas,monospace" font-size="15">08</text><text x="68" y="245" fill="#e8a8ff" font-family="Consolas,monospace" font-size="16">    return list</text><text x="20" y="270" fill="#707782" font-family="Consolas,monospace" font-size="15">09</text><text x="68" y="270" fill="#d6deeb" font-family="Consolas,monospace" font-size="16">        .map((item) =&gt; Recipe.fromJson(item as Map&lt;String, dynamic&gt;))</text><text x="20" y="295" fill="#707782" font-family="Consolas,monospace" font-size="15">10</text><text x="68" y="295" fill="#d6deeb" font-family="Consolas,monospace" font-size="16">        .toList();</text><text x="20" y="320" fill="#707782" font-family="Consolas,monospace" font-size="15">11</text><text x="68" y="320" fill="#d6deeb" font-family="Consolas,monospace" font-size="16">  }</text></svg>